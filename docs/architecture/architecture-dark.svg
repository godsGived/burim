<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Burim architecture (dark)</title>
<desc id="desc">Current architecture of Burim: Client and API Gateway, core services with PostgreSQL and Redis, Kafka event flows, AI Service as MCP client, internal MCP Server, external DeepSeek API and external MCP clients, Keycloak for JWT.</desc>
<defs>
<style>
.bg{fill:#0B1220}
.zone{fill:#0F172A;stroke:#334155;stroke-width:1.5}
.card{fill:#111827;stroke:#334155;stroke-width:1.5}
.ext{fill:#111827;stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 4}
.h1{font:700 26px Inter,Arial,sans-serif;fill:#E5E7EB}
.h2{font:700 22px Inter,Arial,sans-serif;fill:#E5E7EB}
.t{font:700 16px Inter,Arial,sans-serif;fill:#E5E7EB}
.s{font:400 14px Inter,Arial,sans-serif;fill:#E5E7EB}
.m{font:400 13px Inter,Arial,sans-serif;fill:#94A3B8}
.n{font:400 12px Inter,Arial,sans-serif;fill:#94A3B8}
.rest{fill:none;stroke:#60A5FA;stroke-width:2}
.kafka{fill:none;stroke:#FBBF24;stroke-width:2;stroke-dasharray:7 5}
.mcp{fill:none;stroke:#A78BFA;stroke-width:2.5}
.auth{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:3 4}
.dot{fill:#60A5FA}
.cyl{fill:#111827;stroke:#34D399;stroke-width:1.5}
.rim{fill:none;stroke:#34D399;stroke-width:1.5}
.mr{fill:#60A5FA}
.mk{fill:#FBBF24}
.mm{fill:#A78BFA}
.ma{fill:#94A3B8}
.sep{stroke:#1F2937;stroke-width:1}
.bus{stroke:#FBBF24;stroke-width:2}
</style>
<marker id="aRest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="mr" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="aKafka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="aMcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mm" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="aAuth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="ma" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1600" height="900"/>
<text class="h1" x="32" y="44">Burim — Current Architecture</text>
<text class="m" x="32" y="66">As-is state: REST, Kafka events, MCP and JWT validation</text>

<!-- Zone 1: Client / Edge -->
<rect class="zone" x="24" y="88" width="232" height="540" rx="12"/>
<text class="h2" x="44" y="124">Client / Edge</text>
<rect class="card" x="44" y="148" width="192" height="64" rx="12"/>
<text class="t" x="140" y="186" text-anchor="middle">Client</text>
<rect class="card" x="44" y="262" width="192" height="104" rx="12"/>
<text class="t" x="60" y="288">API Gateway</text>
<text class="m" x="60" y="308">:8080</text>
<text class="s" x="60" y="328">Routing + CORS</text>
<text class="s" x="60" y="348">No JWT validation</text>
<rect class="card" x="44" y="460" width="192" height="104" rx="12"/>
<text class="t" x="60" y="486">Keycloak</text>
<text class="m" x="60" y="506">:8180</text>
<text class="s" x="60" y="526">Identity provider</text>
<text class="s" x="60" y="546">Services validate JWT</text>
<path class="rest" d="M140 212 V260" marker-end="url(#aRest)"/>

<!-- Zone 2: Core Services -->
<rect class="zone" x="316" y="88" width="480" height="540" rx="12"/>
<text class="h2" x="340" y="124">Core Services</text>
<text class="m" x="340" y="144">JWT resource servers · JWT validated by each service</text>

<rect class="card" x="340" y="160" width="400" height="68" rx="12"/>
<text class="t" x="356" y="182">Notification Service<tspan class="m" dx="8">:8086</tspan></text>
<text class="s" x="356" y="202">Kafka consumers, notifications</text>
<text class="m" x="356" y="220">Auth: JWT</text>
<path class="cyl" d="M664 173 A16 5 0 0 1 696 173 V193 A16 5 0 0 1 664 193 Z"/>
<path class="rim" d="M664 173 A16 5 0 0 0 696 173"/>
<text class="n" x="680" y="216" text-anchor="middle">PostgreSQL</text>

<rect class="card" x="340" y="252" width="400" height="68" rx="12"/>
<text class="t" x="356" y="274">Cart Service<tspan class="m" dx="8">:8083</tspan></text>
<text class="s" x="356" y="294">Cart stored in Redis</text>
<text class="m" x="356" y="312">Auth: JWT</text>
<path class="cyl" d="M664 265 A16 5 0 0 1 696 265 V285 A16 5 0 0 1 664 285 Z"/>
<path class="rim" d="M664 265 A16 5 0 0 0 696 265"/>
<text class="n" x="680" y="308" text-anchor="middle">Redis</text>

<rect class="card" x="340" y="344" width="400" height="68" rx="12"/>
<text class="t" x="356" y="366">Order Service<tspan class="m" dx="8">:8082</tspan></text>
<text class="s" x="356" y="386">Checkout + Idempotency-Key, cancel</text>
<text class="m" x="356" y="404">Publishes Kafka events after commit</text>
<path class="cyl" d="M664 357 A16 5 0 0 1 696 357 V377 A16 5 0 0 1 664 377 Z"/>
<path class="rim" d="M664 357 A16 5 0 0 0 696 357"/>
<text class="n" x="680" y="400" text-anchor="middle">PostgreSQL</text>

<rect class="card" x="340" y="436" width="400" height="68" rx="12"/>
<text class="t" x="356" y="458">Product Service<tspan class="m" dx="8">:8081</tspan></text>
<text class="s" x="356" y="478">Catalog, filters, pagination, reserves</text>
<text class="m" x="356" y="496">Public GET · JWT on write</text>
<path class="cyl" d="M664 449 A16 5 0 0 1 696 449 V469 A16 5 0 0 1 664 469 Z"/>
<path class="rim" d="M664 449 A16 5 0 0 0 696 449"/>
<text class="n" x="680" y="492" text-anchor="middle">PostgreSQL</text>

<rect class="card" x="340" y="528" width="400" height="68" rx="12"/>
<text class="t" x="356" y="550">Review Service<tspan class="m" dx="8">:8084</tspan></text>
<text class="s" x="356" y="570">Reviews · unique (user_id, product_id)</text>
<text class="m" x="356" y="588">Public GET · /my + write: JWT</text>
<path class="cyl" d="M664 541 A16 5 0 0 1 696 541 V561 A16 5 0 0 1 664 561 Z"/>
<path class="rim" d="M664 541 A16 5 0 0 0 696 541"/>
<text class="n" x="680" y="584" text-anchor="middle">PostgreSQL</text>

<!-- Order -> Cart / Product -->
<path class="rest" d="M400 344 V322" marker-end="url(#aRest)"/>
<text class="n" x="412" y="336">fetch cart</text>
<path class="rest" d="M400 412 V434" marker-end="url(#aRest)"/>
<text class="n" x="412" y="428">reserve stock</text>

<!-- Gateway lane -->
<path class="rest" d="M236 314 H286"/>
<path class="rest" d="M286 194 V668 H560 V738" marker-end="url(#aRest)"/>
<text class="n" x="300" y="660">/api/v1/ai/**</text>
<path class="rest" d="M286 194 H338" marker-end="url(#aRest)"/>
<path class="rest" d="M286 286 H338" marker-end="url(#aRest)"/>
<path class="rest" d="M286 378 H338" marker-end="url(#aRest)"/>
<path class="rest" d="M286 470 H338" marker-end="url(#aRest)"/>
<path class="rest" d="M286 562 H338" marker-end="url(#aRest)"/>
<circle class="dot" cx="286" cy="314" r="3.5"/>
<circle class="dot" cx="286" cy="194" r="3.5"/>
<circle class="dot" cx="286" cy="286" r="3.5"/>
<circle class="dot" cx="286" cy="378" r="3.5"/>
<circle class="dot" cx="286" cy="470" r="3.5"/>
<circle class="dot" cx="286" cy="562" r="3.5"/>

<!-- JWT is validated by each service; no single line to avoid crossing the gateway bus. -->

<!-- Kafka arrows -->
<path class="kafka" d="M980 194 H742" marker-end="url(#aKafka)"/>
<path class="kafka" d="M742 378 H978" marker-end="url(#aKafka)"/>
<path class="kafka" d="M980 470 H742" marker-end="url(#aKafka)"/>
<path class="kafka" d="M742 562 H978" marker-end="url(#aKafka)"/>

<!-- MCP server -> product / review (REST) -->
<path class="rest" d="M720 740 V598" marker-end="url(#aRest)"/>
<path class="rest" d="M772 740 V492 H744" marker-end="url(#aRest)"/>
<text class="n" x="784" y="660">public REST to product / review</text>

<!-- Zone 4: Platform -->
<rect class="zone" x="836" y="88" width="740" height="540" rx="12"/>
<text class="h2" x="860" y="124">Platform</text>

<rect class="card" x="980" y="112" width="300" height="500" rx="12"/>
<text class="t" x="996" y="140">Kafka</text>
<text class="m" x="996" y="158">9092 external / 29092 internal</text>
<line class="sep" x1="996" y1="170" x2="1264" y2="170"/>
<line class="bus" x1="988" y1="184" x2="988" y2="596"/>
<circle class="mk" cx="988" cy="194" r="3"/>
<circle class="mk" cx="988" cy="378" r="3"/>
<circle class="mk" cx="988" cy="470" r="3"/>
<circle class="mk" cx="988" cy="562" r="3"/>
<line class="sep" x1="996" y1="250" x2="1264" y2="250"/>
<text class="s" x="996" y="178">product-reviews-topic</text>
<text class="s" x="996" y="194">order-created-topic</text>
<text class="s" x="996" y="210">order-status-topic</text>
<text class="n" x="996" y="228">consumed by notification-service</text>
<text class="m" x="996" y="292">after-commit events</text>
<text class="n" x="996" y="310">keyed by aggregate id</text>
<line class="sep" x1="996" y1="340" x2="1264" y2="340"/>
<text class="s" x="996" y="374">order-created-topic</text>
<text class="s" x="996" y="392">order-status-topic</text>
<text class="n" x="996" y="410">published by order-service</text>
<line class="sep" x1="996" y1="440" x2="1264" y2="440"/>
<text class="s" x="996" y="474">product-reviews-topic</text>
<text class="n" x="996" y="494">consumed by product-service</text>
<line class="sep" x1="996" y1="530" x2="1264" y2="530"/>
<text class="s" x="996" y="566">product-reviews-topic</text>
<text class="n" x="996" y="586">published by review-service</text>

<rect class="card" x="1320" y="112" width="232" height="148" rx="12"/>
<path class="cyl" d="M1336 135 A16 5 0 0 1 1368 135 V155 A16 5 0 0 1 1336 155 Z"/>
<path class="rim" d="M1336 135 A16 5 0 0 0 1368 135"/>
<text class="t" x="1380" y="152">PostgreSQL</text>
<text class="s" x="1336" y="184">Separate DB per service:</text>
<text class="s" x="1336" y="204">product, order, review,</text>
<text class="s" x="1336" y="222">notification</text>
<text class="m" x="1336" y="244">ai-service, mcp-server: no DB</text>

<rect class="card" x="1320" y="284" width="232" height="92" rx="12"/>
<path class="cyl" d="M1336 305 A16 5 0 0 1 1368 305 V325 A16 5 0 0 1 1336 325 Z"/>
<path class="rim" d="M1336 305 A16 5 0 0 0 1368 305"/>
<text class="t" x="1380" y="322">Redis</text>
<text class="s" x="1336" y="352">Cart storage (cart-service)</text>

<rect class="card" x="1320" y="400" width="232" height="120" rx="12"/>
<text class="t" x="1336" y="426">Data isolation</text>
<text class="s" x="1336" y="448">One PostgreSQL per service</text>
<text class="s" x="1336" y="468">No shared database</text>
<text class="m" x="1336" y="492">ai-service and mcp-server</text>
<text class="m" x="1336" y="508">have no database</text>

<!-- Zone 3: AI / MCP -->
<rect class="zone" x="316" y="684" width="754" height="196" rx="12"/>
<text class="h2" x="340" y="718">AI / MCP</text>

<rect class="card" x="340" y="740" width="300" height="112" rx="12"/>
<text class="t" x="356" y="766">AI Service<tspan class="m" dx="8">:8087</tspan></text>
<text class="s" x="356" y="786">MCP client · Spring AI</text>
<text class="m" x="356" y="806">POST /api/v1/ai/chat · JWT</text>
<text class="m" x="356" y="824">OpenAI-compatible DeepSeek</text>
<text class="m" x="356" y="842">No own DB</text>

<rect class="card" x="700" y="740" width="346" height="112" rx="12"/>
<text class="t" x="716" y="766">MCP Server<tspan class="m" dx="8">:8088</tspan></text>
<text class="s" x="716" y="786">Streamable HTTP · endpoint /mcp</text>
<text class="m" x="716" y="802">Tools (read-only):</text>
<text class="m" x="716" y="816">searchProducts · getProduct</text>
<text class="m" x="716" y="830">getProductReviews · public REST</text>
<text class="m" x="716" y="844">Internal / localhost only · no own DB</text>

<path class="mcp" d="M642 796 H698" marker-end="url(#aMcp)"/>
<text class="n" x="670" y="786" text-anchor="middle">MCP</text>
<text class="n" x="670" y="818" text-anchor="middle">/mcp</text>

<!-- External blocks -->
<rect class="ext" x="24" y="740" width="232" height="112" rx="12"/>
<text class="t" x="40" y="766">DeepSeek API</text>
<text class="s" x="40" y="786">External, outside Burim</text>
<text class="m" x="40" y="806">Called by ai-service (sync)</text>
<path class="rest" d="M338 796 H258" marker-end="url(#aRest)"/>
<text class="n" x="286" y="788" text-anchor="middle">REST</text>

<rect class="ext" x="1110" y="740" width="190" height="112" rx="12"/>
<text class="t" x="1126" y="766">MCP clients</text>
<text class="s" x="1126" y="786">OpenCode / Cursor /</text>
<text class="s" x="1126" y="804">Claude</text>
<text class="m" x="1126" y="826">External, direct to /mcp</text>
<text class="m" x="1126" y="844">Not via API Gateway</text>
<path class="mcp" d="M1108 796 H1048" marker-end="url(#aMcp)"/>
<text class="n" x="1090" y="788" text-anchor="middle">/mcp</text>

<!-- Legend -->
<rect class="zone" x="1324" y="684" width="252" height="196" rx="12"/>
<text class="t" x="1348" y="718">Legend</text>
<path class="rest" d="M1348 748 H1392" marker-end="url(#aRest)"/>
<text class="s" x="1406" y="753">REST (sync)</text>
<path class="kafka" d="M1348 782 H1392" marker-end="url(#aKafka)"/>
<text class="s" x="1406" y="787">Kafka event</text>
<path class="mcp" d="M1348 816 H1392" marker-end="url(#aMcp)"/>
<text class="s" x="1406" y="821">MCP Streamable HTTP</text>
<path class="auth" d="M1348 850 H1392" marker-end="url(#aAuth)"/>
<text class="s" x="1406" y="855">JWT validation / auth</text>
</svg>
