server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: cart-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/burim/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info