spring:
  application:
    name: ai-service

  ai:
    model:
      chat: openai
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
      timeout: 30s
      max-retries: 1
      chat:
        model: ${AI_CHAT_MODEL:deepseek-flash}
        temperature: 0.2
    mcp:
      client:
        type: SYNC
        request-timeout: 20s
        streamable-http:
          connections:
            burim-mcp:
              url: ${MCP_SERVER_URL:http://localhost:8088}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/burim/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: "health, info"

server:
  port: ${SERVER_PORT:8087}
