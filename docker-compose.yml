services:
  burim-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: burim-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command:
      - "start-dev"
    ports:
      - "8180:8080"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    depends_on:
      - kafka

  marketplace-redis:
    image: redis:7.2-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"

  product-db:
    image: postgres:16-alpine
    container_name: burim-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data

  review-db:
    image: postgres:16-alpine
    container_name: burim-review-db
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5434:5432"
    volumes:
      - review_postgres_data:/var/lib/postgresql/data

  order-db:
    image: postgres:16-alpine
    container_name: burim-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: burim-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5436:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

  product-service:
    build:
      context: ./services/product-service
    container_name: burim-product-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - product-db
      - kafka

  review-service:
    build:
      context: ./services/review-service
    container_name: burim-review-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-db:5432/review_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://burim-keycloak:8080/realms/burim/protocol/openid-connect/certs
    depends_on:
      - review-db
      - kafka
      - burim-keycloak

  order-service:
    build:
      context: ./services/order-service
    container_name: burim-order-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://burim-keycloak:8080/realms/burim/protocol/openid-connect/certs
      SERVICES_CART_URL: http://burim-cart-service:8083
      SERVICES_PRODUCT_URL: http://burim-product-service:8081
    depends_on:
      - order-db
      - kafka
      - burim-keycloak
      - cart-service
      - product-service

  cart-service:
    build:
      context: ./services/cart-service
    container_name: burim-cart-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_REDIS_HOST: marketplace-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://burim-keycloak:8080/realms/burim/protocol/openid-connect/certs
    depends_on:
      - marketplace-redis
      - burim-keycloak

  notification-service:
    build:
      context: ./services/notification-service
    container_name: burim-notification-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://burim-keycloak:8080/realms/burim/protocol/openid-connect/certs
      SERVICES_PRODUCT_URL: http://burim-product-service:8081
    depends_on:
      - notification-db
      - kafka
      - burim-keycloak
      - product-service

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: burim-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVICES_PRODUCT_URL: http://burim-product-service:8081
      SERVICES_ORDER_URL: http://burim-order-service:8082
      SERVICES_CART_URL: http://burim-cart-service:8083
      SERVICES_REVIEW_URL: http://burim-review-service:8084
      SERVICES_NOTIFICATION_URL: http://burim-notification-service:8086
    depends_on:
      - product-service
      - order-service
      - cart-service
      - review-service
      - notification-service

volumes:
  product_postgres_data:
  review_postgres_data:
  order_postgres_data:
  notification_postgres_data: